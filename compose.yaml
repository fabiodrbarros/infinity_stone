name: infinity-stone
services:
  website:
    image: infinity-stone:${IMAGE_TAG:-local}
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
      APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN no ficheiro .env}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      TRUST_PROXY: "1"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD no ficheiro .env}
    ports:
      - "127.0.0.1:${PORT:-30602}:3000"
    volumes:
      - infinity-stone-data:/data
    networks:
      default: {}
      web:
        aliases:
          - infinity-stone-web
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  infinity-stone-data:
networks:
  web:
    external: true
    name: web
